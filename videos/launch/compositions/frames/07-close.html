<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/rail.js"></script>
  <script src="compositions/words.js"></script>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    [data-composition-id="07-close"] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    [data-composition-id="07-close"] .k-bg { position: absolute; inset: 0; background: oklch(0.97 0 0); }
    [data-composition-id="07-close"] .k-stage { position: absolute; inset: 0; }
    [data-composition-id="07-close"] svg { position: absolute; left: 0; top: 0; overflow: visible; }
    [data-composition-id="07-close"] h1 { position: absolute; left: 0; right: 0; top: 432px; margin: 0; text-align: center; font-family: "Geist", sans-serif; font-weight: 400; font-size: 120px; line-height: 1.05; letter-spacing: -0.03em; color: #0A0A0A; }
    [data-composition-id="07-close"] h1 span { display: inline-block; }
    [data-composition-id="07-close"] .rows { position: absolute; left: 50%; transform: translateX(-50%); top: 616px; display: grid; grid-template-columns: 220px auto; row-gap: 16px; align-items: center; }
    [data-composition-id="07-close"] .lab { font-family: "Geist", sans-serif; font-size: 36px; color: #636363; }
    [data-composition-id="07-close"] .chip { justify-self: start; font-family: "Geist Mono", monospace; font-size: 34px; color: #0A0A0A; background: #fff; border: 2px solid #0A0A0A; border-radius: 10px; padding: 10px 20px; white-space: nowrap; }
  </style>

  <div id="root" data-composition-id="07-close" data-width="1920" data-height="1080" data-duration="8">
    <div id="f07-bg" class="k-bg clip" data-start="0" data-duration="8" data-track-index="0"></div>
    <div id="f07-stage" class="k-stage clip" data-start="0" data-duration="8" data-track-index="1">
      <svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
      <h1><span>Every</span> <span>LLM.</span> <span>One</span> <span>API.</span></h1>
      <div class="rows">
        <span class="lab r1">Get API key</span><span class="chip r1">anyrouter.dev</span>
        <span class="lab r2">Code</span><span class="chip r2">curl -fsSL https://anyrouter.dev/cli.sh | bash</span>
        <span class="lab r3">Free tier</span><span class="chip r3">anyrouter.dev/pool</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const ID = '07-close';
      const root = document.querySelector('[data-composition-id="07-close"]');
      const { el, hub, dot } = window.Rail;
      const w = word => W(7, word);
      const $$ = s => [...root.querySelectorAll(s)];

      document.fonts.ready.then(() => {
        const svg = root.querySelector('svg.fig');
        const C = [960, 300], RING = 93;
        hub(svg, C, RING, null);
        const dots = el(svg, 'g');
        const tl = gsap.timeline({ paused: true });

        // The H1 lands a word at a time on "One key. Every model."
        const words = $$('h1 span');
        [w('one'), w('key'), w('every'), w('model')].forEach((at, i) =>
          tl.fromTo(words[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, at - 0.05));
        [['.r1', w('pool')], ['.r2', w('start')], ['.r3', w('anyrouter.dev')]].forEach(([s, at]) =>
          tl.fromTo($$(s), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, at));

        // One dot goes once round the ring, then everything holds still.
        const d = dot(dots);
        const a = { t: 0 };
        tl.set(d, { attr: { opacity: 1 } }, 0.4);
        tl.fromTo(a, { t: 0 }, { t: 1, duration: 2, ease: 'none', immediateRender: false, onUpdate: () => {
          const th = -Math.PI / 2 + a.t * 2 * Math.PI;
          d.setAttribute('cx', C[0] + RING * Math.cos(th));
          d.setAttribute('cy', C[1] + RING * Math.sin(th));
        } }, 0.4);
        tl.set(d, { attr: { opacity: 0 } }, 2.4);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
