<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/rail.js"></script>
  <script src="compositions/words-reel.js"></script>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    [data-composition-id="r1-hook"] { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    [data-composition-id="r1-hook"] .k-bg { position: absolute; inset: 0; background: oklch(0.97 0 0); }
    [data-composition-id="r1-hook"] .k-stage { position: absolute; inset: 0; }
    [data-composition-id="r1-hook"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    [data-composition-id="r1-hook"] svg.fig { position: absolute; left: 0; top: 0; overflow: visible; }
    [data-composition-id="r1-hook"] .hook { position: absolute; left: 60px; width: 890px; top: 230px; text-align: center; font-family: "Geist", sans-serif; font-weight: 400; font-size: 88px; line-height: 1.05; letter-spacing: -0.03em; color: #0A0A0A; }

  </style>

  <div id="root" data-composition-id="r1-hook" data-width="1080" data-height="1920" data-duration="4.2">
    <div id="r1-hook-bg" class="k-bg clip" data-start="0" data-duration="4.2" data-track-index="0"></div>
    <div id="r1-hook-stage" class="k-stage clip" data-start="0" data-duration="4.2" data-track-index="1">
      <div class="cam"><svg class="fig" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><div class="hook">One key. Then this.</div>
</div>
    </div>
  </div>

  <script>
    (() => {
      const ID = 'r1-hook';
      const root = document.querySelector('[data-composition-id="r1-hook"]');
      const w = (word, nth, edge) => WR(1, word, nth, edge);
      document.fonts.ready.then(() => {
        const svg = root.querySelector('svg.fig');
        const L = { rails: Rail.el(svg, 'g'), wires: Rail.el(svg, 'g'), dots: Rail.el(svg, 'g'), top: Rail.el(svg, 'g') };
        const tl = gsap.timeline({ paused: true });
        const cam = Rail.camera(root.querySelector('.cam'), root);
        cam.set(tl, { s: 1, cx: 540, cy: 960 }, 0);
        // /pool's "One key, alone" row, turned to run top to bottom. Frame 0 already shows the 429.
        const { T, el, wire, node, chip, dot, travel } = Rail;
        const X = 505, KEY = 470, STOP = 930;
        wire(L.wires, [[X, KEY + 30], [X, STOP]], { stroke: T.ink });
        for (let y = KEY + 90; y < STOP; y += 70) el(L.wires, 'line', { x1: X - 10, x2: X + 10, y1: y, y2: y, stroke: T.ink, 'stroke-width': 2 });
        el(L.wires, 'line', { x1: X - 64, x2: X + 64, y1: STOP, y2: STOP, stroke: T.red, 'stroke-width': 2, 'stroke-dasharray': '6 6' });
        el(L.wires, 'line', { x1: X, x2: X, y1: STOP + 120, y2: 1200, stroke: T.idle, 'stroke-width': 2, 'stroke-dasharray': '3 10' });
        node(L.top, [X, KEY], 'openrouter', { size: 60, r: 0, stroke: T.ink, mono: false });
        const stop = chip(L.top, [X, STOP + 64], '429 rate limited', { size: 48, stroke: T.red, fill: T.page, color: T.red });
        const toStop = Rail.path([[X, KEY + 30], [X, STOP - 10]]);
        [0.3, 0.75].forEach(at => {
          const d = dot(L.dots, 11);
          travel(tl, d, toStop, at, 0.9, { hide: false });
          tl.to(d, { attr: { opacity: 0 }, duration: 0.25 }, at + 0.9);
        });
        const halt = w('stops');
        travel(tl, dot(L.dots, 11), toStop, halt - 0.9, 0.9, { hide: false });
        tl.fromTo(stop.box, { attr: { 'stroke-width': 2 } }, { attr: { 'stroke-width': 4 }, duration: 0.1 }, halt);
        tl.to(stop.box, { attr: { 'stroke-width': 2 }, duration: 0.3 }, halt + 0.1);
        
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
