<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/rail.js"></script>
  <script src="compositions/words-reel.js"></script>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    [data-composition-id="r3-code"] { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    [data-composition-id="r3-code"] .k-bg { position: absolute; inset: 0; background: oklch(0.97 0 0); }
    [data-composition-id="r3-code"] .k-stage { position: absolute; inset: 0; }
    [data-composition-id="r3-code"] .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    [data-composition-id="r3-code"] svg.fig { position: absolute; left: 0; top: 0; overflow: visible; }
    [data-composition-id="r3-code"] .plate { position: absolute; left: 95px; width: 820px; top: 600px; box-sizing: border-box; padding: 28px 36px 34px; background: #fff; border: 2px solid #E5E5E5; border-radius: 16px; }
    [data-composition-id="r3-code"] .plate .lab { font-family: "Geist", sans-serif; font-size: 36px; color: #636363; }
    [data-composition-id="r3-code"] .plate .url { position: relative; margin-top: 14px; font-family: "Geist Mono", monospace; font-size: 40px; color: #0A0A0A; white-space: nowrap; display: inline-block; }
    [data-composition-id="r3-code"] .plate .ul { position: absolute; left: 0; right: 0; bottom: -8px; height: 3px; background: oklch(0.555 0.163 49); transform-origin: 0 50%; }
    [data-composition-id="r3-code"] .note { position: absolute; left: 95px; width: 820px; top: 830px; font-family: "Geist", sans-serif; font-size: 40px; color: #636363; text-align: center; }

  </style>

  <div id="root" data-composition-id="r3-code" data-width="1080" data-height="1920" data-duration="6">
    <div id="r3-code-bg" class="k-bg clip" data-start="0" data-duration="6" data-track-index="0"></div>
    <div id="r3-code-stage" class="k-stage clip" data-start="0" data-duration="6" data-track-index="1">
      <div class="cam"><svg class="fig" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><div class="plate"><div class="lab">Base URL</div><div class="url">https://anyrouter.dev/api/v1<i class="ul"></i></div></div>
<div class="note">OpenAI- and Anthropic-compatible. Switch models, keep your code.</div>
</div>
    </div>
  </div>

  <script>
    (() => {
      const ID = 'r3-code';
      const root = document.querySelector('[data-composition-id="r3-code"]');
      const w = (word, nth, edge) => WR(3, word, nth, edge);
      document.fonts.ready.then(() => {
        const svg = root.querySelector('svg.fig');
        const L = { rails: Rail.el(svg, 'g'), wires: Rail.el(svg, 'g'), dots: Rail.el(svg, 'g'), top: Rail.el(svg, 'g') };
        const tl = gsap.timeline({ paused: true });
        const cam = Rail.camera(root.querySelector('.cam'), root);
        cam.set(tl, { s: 1, cx: 540, cy: 960 }, 0);
        // The home hero's own base URL field and subline, verbatim; then the model count chip.
        const { T, G, hub, chip } = Rail;
        const R = G.tall.routing, PT = G.tall.pool;
        const h = hub(L.top, R.hub, R.ring, null);
        const top = [505, 400];
        Rail.place(tl, h.el, { x: 0, y: 0, s: 1 }, Rail.poseAt(R.hub, top, 1), 0.1, 0.8);
        const $ = s => root.querySelector(s);
        tl.fromTo($('.plate'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, w('change') - 0.2);
        tl.fromTo($('.plate .ul'), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power3.out' }, w('url'));
        tl.fromTo($('.note'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, w('keep'));
        const models = chip(L.top, [505, 1050], '400+ models', { size: 48, stroke: T.ink, fill: T.page, color: T.ink });
        tl.fromTo(models.el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, w('more') - 0.1);
        // hand-off: the hub slides to where the Pool's hub sits
        const out = 5.2;
        tl.to([$('.plate'), $('.note'), models.el], { opacity: 0, duration: 0.4 }, out);
        Rail.place(tl, h.el, Rail.poseAt(R.hub, top, 1), Rail.poseAt(R.hub, PT.hub, PT.ring / R.ring), out + 0.1, 0.7);
        
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
