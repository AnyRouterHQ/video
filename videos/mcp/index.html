<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f7f4ec; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f7f4ec; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <div id="el-01-url" class="scene" data-composition-id="01-url" data-composition-src="compositions/frames/01-url.html" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="el-02-list" class="scene" data-composition-id="02-list" data-composition-src="compositions/frames/02-list.html" data-start="4.5" data-duration="5" data-track-index="1"></div>
      <div id="el-03-command" class="scene" data-composition-id="03-command" data-composition-src="compositions/frames/03-command.html" data-start="9.5" data-duration="5" data-track-index="2"></div>
      <div id="el-04-close" class="scene" data-composition-id="04-close" data-composition-src="compositions/frames/04-close.html" data-start="14.5" data-duration="3.5" data-track-index="3"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
